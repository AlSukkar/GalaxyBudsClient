name: Sync upstream and build Android APK

on:
  schedule:
    - cron: '0 3 * * *'   # daily at 03:00 UTC
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build even if nothing relevant changed'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-and-build
  cancel-in-progress: false

env:
  UPSTREAM_REPO: timschneeb/GalaxyBudsClient
  UPSTREAM_BRANCH: master

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.sync.outputs.build }}
      short: ${{ steps.sync.outputs.short }}
      head: ${{ steps.sync.outputs.head }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # SYNC_TOKEN is optional. It is only needed if upstream ever changes
          # files under .github/workflows (GITHUB_TOKEN cannot push those).
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge upstream and decide whether to build
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force_build }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "${UPSTREAM_BRANCH}"

          ORIGINAL_HEAD=$(git rev-parse HEAD)
          if ! git merge --no-edit "upstream/${UPSTREAM_BRANCH}"; then
            git merge --abort || true
            echo "::error::Merge conflict with upstream. Resolve it manually in your fork."
            exit 1
          fi

          if [ "$(git rev-parse HEAD)" != "$ORIGINAL_HEAD" ]; then
            git push origin HEAD || {
              echo "::error::Push rejected. If upstream changed .github/workflows, add a SYNC_TOKEN secret (personal access token with Contents + Workflows write access)."
              exit 1
            }
          fi

          UP_SHA=$(git rev-parse "upstream/${UPSTREAM_BRANCH}")
          SHORT=$(git rev-parse --short=7 "upstream/${UPSTREAM_BRANCH}")

          # Paths that cannot affect the Android build (guessed from folder names; edit as needed)
          IRRELEVANT='^(\.github/|docs/|meta/|screenshots/|GalaxyBudsClient\.Tests/|GalaxyBudsClient\.Platform\.(Linux|OSX|Windows|WindowsRT)/|ThePBone\.(BlueZNet|MprisClient)/)|\.md$|^(install\.nsi|FUNDING\.yml|LICENSE|GalaxyBudsClient\.sln\.DotSettings)$'

          # The last release tag (build-<upstream sha>) records what was last built.
          LAST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
          LAST_SHA="${LAST_TAG#build-}"

          BUILD=false
          if [ "${FORCE:-}" = "true" ]; then
            BUILD=true
            echo "Reason: forced build"
          elif [ -z "$LAST_TAG" ] || ! git cat-file -e "${LAST_SHA}^{commit}" 2>/dev/null; then
            BUILD=true
            echo "Reason: no previous build found"
          elif [ "$LAST_SHA" = "$SHORT" ]; then
            echo "Already built upstream ${SHORT}"
          else
            CHANGED=$(git diff --name-only "$LAST_SHA" "$UP_SHA" | grep -Ev "$IRRELEVANT" || true)
            if [ -n "$CHANGED" ]; then
              BUILD=true
              echo "Reason: relevant upstream changes since ${LAST_SHA}:"
              echo "$CHANGED"
            else
              echo "Upstream changed, but nothing relevant to the Android build"
            fi
          fi

          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: sync
    if: needs.sync.outputs.build == 'true'
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_DIR: ${{ github.workspace }}/android-sdk
    steps:
      - name: Checkout merged code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.head }}

      # Uses the exact SDK version pinned in the repo's global.json
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Detect project and target framework
        run: |
          CSPROJ=$(find GalaxyBudsClient.Android -maxdepth 1 -name '*.csproj' | head -n1)
          TFM=$(grep -oE 'net[0-9]+\.[0-9]+-android[0-9]+(\.[0-9]+)?' "$CSPROJ" | head -n1)
          echo "Project: $CSPROJ"
          echo "Target framework: $TFM"
          if [ -z "$CSPROJ" ] || [ -z "$TFM" ]; then
            echo "Could not detect csproj or target framework"; exit 1
          fi
          echo "CSPROJ=$CSPROJ" >> "$GITHUB_ENV"
          echo "TFM=$TFM" >> "$GITHUB_ENV"

      - name: Install Android SDK dependencies
        run: |
          dotnet build "$CSPROJ" -t:InstallAndroidDependencies -f "$TFM" \
            -p:AndroidSdkDirectory="$ANDROID_SDK_DIR" \
            -p:AcceptAndroidSDKLicenses=True

      # Restore explicitly for the exact Android TFM used by publish. This avoids
      # NETSDK1005 when an earlier target or implicit restore populated project.assets.json.
      - name: Restore Android project (arm64-v8a only)
        run: |
          set -euo pipefail
          dotnet restore "$CSPROJ" --force \
            --runtime android-arm64 \
            -p:TargetFramework="$TFM" \
            -p:AndroidSdkDirectory="$ANDROID_SDK_DIR"

      # A fixed signing key is required so each new APK can update the previous install.
      # Without it, every CI run generates a fresh debug key and Android rejects the update.
      - name: Build APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SIGN_ARGS=()
          if [ -n "${KS_B64:-}" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            SIGN_ARGS+=(
              -p:AndroidKeyStore=true
              -p:AndroidSigningKeyStore="$RUNNER_TEMP/release.jks"
              -p:AndroidSigningStorePass="$KS_PASS"
              -p:AndroidSigningKeyAlias="$KEY_ALIAS"
              -p:AndroidSigningKeyPass="$KEY_PASS"
            )
          else
            echo "::warning::No signing secrets set. APK is debug-signed with a throwaway key and cannot update a previous install."
          fi

          dotnet publish "$CSPROJ" -f "$TFM" -c Debug --no-restore \
            --runtime android-arm64 \
            -p:AndroidPackageFormats=apk \
            -p:AndroidSdkDirectory="$ANDROID_SDK_DIR" \
            -p:DebugType=PdbOnly \
            -p:EmbedAssembliesIntoApk=true \
            -p:NoDemo=true \
            "${SIGN_ARGS[@]}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT: ${{ needs.sync.outputs.short }}
          HEAD_SHA: ${{ needs.sync.outputs.head }}
        run: |
          set -euo pipefail
          APK=$(find GalaxyBudsClient.Android -path '*/bin/*' -name '*-Signed.apk' | head -n1)
          if [ -z "$APK" ]; then
            APK=$(find GalaxyBudsClient.Android -path '*/bin/*' -name '*.apk' | head -n1)
          fi
          if [ -z "$APK" ]; then echo "::error::No APK found"; exit 1; fi

          cp "$APK" "GalaxyBudsClient-${SHORT}.apk"
          ls -lh "GalaxyBudsClient-${SHORT}.apk"

          # Allow re-running a build for the same upstream commit
          gh release delete "build-${SHORT}" --cleanup-tag --yes || true

          gh release create "build-${SHORT}" "GalaxyBudsClient-${SHORT}.apk" \
            --target "$HEAD_SHA" \
            --title "Galaxy Buds Client (upstream ${SHORT})" \
            --notes "Android build from upstream ${UPSTREAM_REPO}@${SHORT}."
